name: Deploy Codepath to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
      - name: Type check
        run: pnpm --filter @workspace/codepath typecheck
      - name: Build
        env:
          BASE_PATH: /codepath/
        run: pnpm --filter @workspace/codepath build
      - name: Support direct links and page reloads
        run: cp artifacts/codepath/dist/public/index.html artifacts/codepath/dist/public/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/codepath/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
